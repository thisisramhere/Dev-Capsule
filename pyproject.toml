[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcapsule"
version = "0.1.0"
description = "AI-Powered Developer Environment Replicator -- scan, capsule, and restore full dev setups across machines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "psutil>=5.9",
]

[project.scripts]
devcapsule = "devcapsule.cli:main"

[tool.setuptools]
packages = ["devcapsule"]
